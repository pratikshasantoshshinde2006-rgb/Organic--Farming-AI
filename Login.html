<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Organic Farming - Login</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f9b4d, #7ed957);
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: white;
    border-radius: 25px;
    padding: 30px 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

.logo {
    font-size: 65px;
    margin-bottom: 5px;
}

h1 {
    color: #168542;
    font-size: 27px;
    margin-bottom: 8px;
}

.subtitle {
    color: #666;
    font-size: 14px;
    margin-bottom: 25px;
}

.input-box {
    position: relative;
    margin-bottom: 15px;
}

.input-box span {
    position: absolute;
    left: 15px;
    top: 14px;
    font-size: 20px;
}

input {
    width: 100%;
    padding: 14px 15px 14px 48px;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #168542;
    box-shadow: 0 0 5px rgba(22,133,66,0.3);
}

.login-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #168542;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
}

.login-btn:active {
    transform: scale(0.98);
}

.message {
    margin-top: 15px;
    font-size: 14px;
    font-weight: bold;
}

.features {
    margin-top: 25px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.feature {
    background: #f0f9f2;
    padding: 12px 5px;
    border-radius: 12px;
    color: #26733e;
    font-size: 13px;
}

.footer {
    margin-top: 20px;
    color: #888;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">🌱</div>

    <h1>Smart Organic Farming</h1>

    <p class="subtitle">
        Your smart farming assistant
    </p>

    <form id="loginForm">

        <div class="input-box">
            <span>👤</span>
            <input
                type="text"
                id="username"
                placeholder="Enter your name"
                required
            >
        </div>

        <div class="input-box">
            <span>📱</span>
            <input
                type="tel"
                id="mobile"
                placeholder="Enter mobile number"
                maxlength="10"
                required
            >
        </div>

        <button type="submit" class="login-btn">
            🌿 Login
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="features">
        <div class="feature">🌾 Crop Guide</div>
        <div class="feature">🌦️ Weather</div>
        <div class="feature">🐛 Pest Detection</div>
        <div class="feature">🤖 AI Farming</div>
    </div>

    <div class="footer">
        Smart • Organic • Sustainable 🌱
    </div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    let name = document.getElementById("username").value.trim();
    let mobile = document.getElementById("mobile").value.trim();
    let message = document.getElementById("message");

    if (name === "" || mobile === "") {
        message.style.color = "red";
        message.innerHTML = "Please enter all details.";
        return;
    }

    if (!/^[0-9]{10}$/.test(mobile)) {
        message.style.color = "red";
        message.innerHTML = "Please enter a valid 10-digit mobile number.";
        return;
    }

    // Save farmer name
    localStorage.setItem("farmerName", name);

    message.style.color = "#168542";
    message.innerHTML = "✅ Login successful!";

    // Open your main app
    setTimeout(function() {
        window.location.href = "index.html";
    }, 800);

});

</script>

</body>
</html>
