<!DOCTYPE html>
<html>
<head>
<title>Profile</title>
<link rel="stylesheet" href="Style.css">
</head>

<body>

<h1>👤 Farmer Profile</h1>

<div class="card">
<h2>📷 Profile Photo</h2>
<input type="file" accept="image/*">
</div>

<div class="card">
<h2>👨‍🌾 Name</h2>
<input type="text" placeholder="Enter Your Name">
</div>

<div class="card">
<h2>📱 Mobile Number</h2>
<input type="number" placeholder="Enter Mobile Number">
</div>

<div class="card">
<h2>🏡 Village</h2>
<input type="text" placeholder="Enter Village Name">
</div>

<div class="card">
<h2>🌾 Land Area</h2>
<input type="text" placeholder="Enter Land Area">
</div>

<div class="card">
<h2>🌱 Main Crops</h2>
<input type="text" placeholder="Enter Main Crops">
</div>

<br>

<a href="index.html">
<button>🏠 Home</button>
</a>

</body>
</html>
